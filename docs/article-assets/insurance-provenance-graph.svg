<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc">
  <title id="title">Mnemosyne runtime provenance graph for an insurance premium incident</title>
  <desc id="desc">A layered graph with runtime configuration and AI score feeding a risk adjustment, then a premium calculation, package rounding, and final result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.heading{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.caption{font:15px Inter,Arial,sans-serif;fill:#475569}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{rx:12;stroke-width:2}.t{font:600 16px Inter,Arial,sans-serif;text-anchor:middle}.s{font:13px Inter,Arial,sans-serif;text-anchor:middle}
      .input{fill:#eff6ff;stroke:#3b82f6}.ai{fill:#faf5ff;stroke:#9333ea}.config{fill:#fffbeb;stroke:#d97706}.op{fill:#f1f5f9;stroke:#64748b}.pkg{fill:#ecfdf5;stroke:#059669}.out{fill:#dcfce7;stroke:#16a34a}
      .dark{fill:#1e3a8a}.purple{fill:#6b21a8}.amber{fill:#92400e}.slate{fill:#1e293b}.green{fill:#065f46}
    </style>
  </defs>
  <rect class="bg" width="1400" height="740" rx="20"/>
  <text class="heading" x="48" y="54">Runtime provenance graph · premium result 863.45</text>
  <text class="caption" x="48" y="82">Nodes show recorded values; arrows show observed input dependencies in this execution.</text>
  <path class="edge" d="M190 190 L350 310"/><path class="edge" d="M190 320 L350 330"/><path class="edge" d="M190 460 L350 355"/>
  <path class="edge" d="M520 330 L670 330"/><path class="edge" d="M190 590 L350 350"/>
  <path class="edge" d="M520 330 C590 330 590 490 670 490"/><path class="edge" d="M830 330 L980 410"/><path class="edge" d="M830 490 L980 430"/>
  <path class="edge" d="M1140 420 L1260 420"/>
  <rect class="box input" x="40" y="150" width="150" height="80"/><text class="t dark" x="115" y="182">Base premium</text><text class="s dark" x="115" y="205">$715.20 · node 7</text>
  <rect class="box input" x="40" y="280" width="150" height="80"/><text class="t dark" x="115" y="312">AI score</text><text class="s dark" x="115" y="335">0.63 · node 39</text>
  <rect class="box config" x="40" y="420" width="150" height="80"/><text class="t amber" x="115" y="452">Risk weight</text><text class="s amber" x="115" y="475">0.3290124 · node 24</text>
  <rect class="box input" x="40" y="550" width="150" height="80"/><text class="t dark" x="115" y="582">Policy / rating</text><text class="s dark" x="115" y="605">other traced inputs</text>
  <rect class="box op" x="350" y="285" width="170" height="90"/><text class="t slate" x="435" y="319">riskAdjustment</text><text class="s slate" x="435" y="345">1.2072778 · node 46</text>
  <rect class="box op" x="670" y="285" width="160" height="90"/><text class="t slate" x="750" y="319">premium × factor</text><text class="s slate" x="750" y="345">863.445 · node 55</text>
  <rect class="box op" x="670" y="445" width="160" height="90"/><text class="t slate" x="750" y="479">other calculation</text><text class="s slate" x="750" y="505">independent branch</text>
  <rect class="box pkg" x="980" y="375" width="160" height="90"/><text class="t green" x="1060" y="409">lodash.round</text><text class="s green" x="1060" y="435">863.45 · node 60</text>
  <rect class="box out" x="1260" y="380" width="120" height="80"/><text class="t green" x="1320" y="412">premium</text><text class="s green" x="1320" y="436">863.45 · node 61</text>
  <rect class="box ai" x="40" y="660" width="150" height="56"/><text class="t purple" x="115" y="694">AI provenance · OpenAI / GPT-5</text>
  <text class="caption" x="230" y="690">This is an incident illustration; node IDs and values must be replaced with those from the actual captured trace.</text>
</svg>
