<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Why Did a $715.20 Premium Become $863.45?</title>
  <desc id="desc">Observed execution path: a base premium, GPT-5 risk score, and orange configuration input feed a risk adjustment. That multiplier raises the premium to 863 dollars and 445 thousandths, lodash rounds it to 863 dollars and 45 cents, and the graph marks the configuration value as the root cause.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>
      .background{fill:#f8fafc}.title{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Inter,Arial,sans-serif;fill:#475569}
      .edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.node{filter:url(#shadow);stroke-width:2;rx:16}
      .heading{font:600 18px Inter,Arial,sans-serif;text-anchor:middle}.formula{font:15px Inter,Arial,sans-serif;text-anchor:middle}.result{font:700 21px Inter,Arial,sans-serif;text-anchor:middle}
      .blue{fill:#eff6ff;stroke:#3b82f6}.blueText{fill:#1e3a8a}.purple{fill:#faf5ff;stroke:#9333ea}.purpleText{fill:#6b21a8}
      .orange{fill:#fff7ed;stroke:#ea580c}.orangeText{fill:#9a3412}.neutral{fill:#f1f5f9;stroke:#64748b}.neutralText{fill:#1e293b}
      .green{fill:#ecfdf5;stroke:#059669}.greenText{fill:#065f46}.darkGreen{fill:#166534;stroke:#14532d}.whiteText{fill:#fff}
      .badge{fill:#ffedd5;stroke:#fb923c;stroke-width:1}.badgeText{font:700 11px Inter,Arial,sans-serif;fill:#9a3412;text-anchor:middle;letter-spacing:.6px}
      .legendText{font:14px Inter,Arial,sans-serif;fill:#334155}.query{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12}.queryLabel{font:700 13px Inter,Arial,sans-serif;fill:#475569}.queryCode{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#0f172a}
      .takeaway{font:600 17px Inter,Arial,sans-serif;fill:#0f172a}
    </style>
  </defs>
  <rect class="background" width="1600" height="760" rx="22"/>
  <text class="title" x="54" y="58">Why Did a $715.20 Premium Become $863.45?</text>
  <text class="subtitle" x="54" y="90">Observed execution path showing how the final premium was produced</text>

  <!-- Provenance edges: inputs feed the adjustment; base and adjustment feed the amount. -->
  <path class="edge" d="M295 220 C325 220 328 349 365 349"/>
  <path class="edge" d="M295 365 L365 365"/>
  <path class="edge" d="M295 510 C325 510 328 381 365 381"/>
  <path class="edge" d="M615 365 L715 365"/>
  <path class="edge" d="M295 220 C485 145 580 145 715 330"/>
  <path class="edge" d="M965 365 L1055 365"/>
  <path class="edge" d="M1295 365 L1370 365"/>

  <rect class="node blue" x="55" y="175" width="240" height="90"/>
  <text class="heading blueText" x="175" y="210">Base Premium</text>
  <text class="result blueText" x="175" y="242">$715.20</text>

  <rect class="node purple" x="55" y="320" width="240" height="90"/>
  <text class="heading purpleText" x="175" y="354">AI Call · OpenAI GPT-5</text>
  <text class="formula purpleText" x="175" y="382">Risk Score = 0.63</text>

  <rect class="node orange" x="55" y="465" width="240" height="90"/>
  <rect class="badge" x="193" y="477" width="88" height="22" rx="11"/>
  <text class="badgeText" x="237" y="492">ROOT CAUSE</text>
  <text class="heading orangeText" x="160" y="514">Configuration Input</text>
  <text class="formula orangeText" x="175" y="539">AI_RISK_WEIGHT = 0.3290124</text>

  <rect class="node neutral" x="365" y="300" width="250" height="130"/>
  <text class="heading neutralText" x="490" y="333">Risk Adjustment</text>
  <text class="formula neutralText" x="490" y="365">1 + (0.63 × 0.3290124)</text>
  <text class="result neutralText" x="490" y="402">= 1.2072778</text>

  <rect class="node neutral" x="715" y="300" width="250" height="130"/>
  <text class="heading neutralText" x="840" y="333">Adjusted Premium</text>
  <text class="formula neutralText" x="840" y="365">$715.20 × 1.2072778</text>
  <text class="result neutralText" x="840" y="402">= $863.445</text>

  <rect class="node green" x="1055" y="300" width="240" height="130"/>
  <text class="heading greenText" x="1175" y="333">lodash.round()</text>
  <text class="formula greenText" x="1175" y="365">Input: $863.445</text>
  <text class="result greenText" x="1175" y="402">Output: $863.45</text>

  <rect class="node darkGreen" x="1370" y="315" width="175" height="100"/>
  <text class="heading whiteText" x="1457" y="353">Premium</text>
  <text class="result whiteText" x="1457" y="387">$863.45</text>

  <!-- Legend -->
  <g transform="translate(55 620)">
    <circle cx="8" cy="0" r="7" fill="#3b82f6"/><text class="legendText" x="22" y="5">Observed Value</text>
    <circle cx="190" cy="0" r="7" fill="#9333ea"/><text class="legendText" x="204" y="5">AI Call</text>
    <circle cx="305" cy="0" r="7" fill="#ea580c"/><text class="legendText" x="319" y="5">Configuration Input</text>
    <circle cx="520" cy="0" r="7" fill="#059669"/><text class="legendText" x="534" y="5">Package Boundary</text>
    <circle cx="715" cy="0" r="7" fill="#14532d"/><text class="legendText" x="729" y="5">Final Result</text>
  </g>

  <rect class="query" x="1190" y="575" width="355" height="66"/>
  <text class="queryLabel" x="1210" y="599">MCP TRACE QUERY</text>
  <text class="queryCode" x="1210" y="624">query_causality("premium")</text>

  <text class="takeaway" x="55" y="696">This graph shows what actually happened in this execution—not what could have happened.</text>
</svg>
